name: Deploy SABR Site

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and Build
        uses: withastro/action@v2
        with:
          package-manager: npm

      # This is the fix: Ensure the action is pointed at the output directory
      - name: Deploy to Sevalla
        uses: Sevalla/deploy-action@v1 # Replace with your specific deployment action name
        with:
          dist_dir: dist
          token: ${{ secrets.SEVALLA_TOKEN }}

      - name: Purge Cloudflare Cache
        uses: jakejarvis/cloudflare-purge-action@master
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
