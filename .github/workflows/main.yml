name: Deploy SABR Site

on:
  push:
    branches: ["main"]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        uses: withastro/action@v2
        with:
          package-manager: npm

      # Force all files into a single archive to prevent platform pruning
      - name: Package for Deployment
        run: tar -czf site.tar.gz -C dist .

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: site-artifact
          path: site.tar.gz
