name: Verify Artifact
on: [push]
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          npm install
          npm run build
      - name: List Artifacts
        run: find dist -type f | wc -l
      - name: Detailed Manifest
        run: ls -R dist
